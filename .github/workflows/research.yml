name: Free literature monitoring
on:
  workflow_dispatch:
  schedule:
    - cron: '17 21 * * 0'
permissions:
  contents: read
concurrency:
  group: literature-monitor
  cancel-in-progress: false
jobs:
  research:
    if: github.event.repository.private == false
    # Public repositories: standard hosted Linux runners are free.
    # Private repositories: disable schedules unless included minutes are available.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python research.py --limit 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-${{ github.run_id }}
          path: results/
          retention-days: 7
